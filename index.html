const allDNs = ["DN40", "DN50", "DN60", "DN65", "DN80", "DN100", "DN125", "DN150", "DN200"];

function renderTable() {
    const kMode = document.getElementById('kSelect').value;
    const dnFilter = document.getElementById('dnFilter').value;
    const qFilter = parseFloat(document.getElementById('qInput').value);

    const activeDNs = (dnFilter === 'all') ? allDNs : [dnFilter];

    // Build Header
    let headHTML = '<tr><th rowspan="3">Q<br>(l/s)</th>';
    activeDNs.forEach(dn => {
        let colSpan = (kMode === 'both') ? 3 : 2;
        headHTML += `<th colspan="${colSpan}">${dn}</th>`;
    });
    headHTML += '</tr><tr>';

    activeDNs.forEach(() => {
        if (kMode === 'both') {
            headHTML += '<th colspan="2">j (m/km)</th><th rowspan="2">v<br>(m/s)</th>';
        } else {
            headHTML += '<th>j (m/km)</th><th rowspan="2">v<br>(m/s)</th>';
        }
    });
    headHTML += '</tr>';

    if (kMode === 'both') {
        headHTML += '<tr>';
        activeDNs.forEach(() => {
            headHTML += '<th>k = 0,03mm</th><th>k = 0,10mm</th>';
        });
        headHTML += '</tr>';
    } else if (kMode === '0.03') {
        headHTML += '<tr>';
        activeDNs.forEach(() => { headHTML += '<th>k = 0,03mm</th>'; });
        headHTML += '</tr>';
    } else if (kMode === '0.10') {
        headHTML += '<tr>';
        activeDNs.forEach(() => { headHTML += '<th>k = 0,10mm</th>'; });
        headHTML += '</tr>';
    }

    document.getElementById('tableHead').innerHTML = headHTML;

    // Build Body
    let bodyHTML = '';
    rawData.forEach(row => {
        if (!isNaN(qFilter) && row.Q !== qFilter) return;

        let rowHTML = `<tr><td><b>${row.Q.toFixed(2).replace('.', ',')}</b></td>`;
        let hasData = false;

        activeDNs.forEach(dn => {
            const data = row[dn];
            if (data) {
                hasData = true;
                if (kMode === 'both') {
                    rowHTML += `<td class="red-text">${data.k03 ? data.k03.toFixed(3).replace('.', ',') : ''}</td>
                                <td class="red-text">${data.k10 ? data.k10.toFixed(3).replace('.', ',') : ''}</td>
                                <td class="blue-text">${data.v ? data.v.toFixed(2).replace('.', ',') : ''}</td>`;
                } else if (kMode === '0.03') {
                    rowHTML += `<td class="red-text">${data.k03 ? data.k03.toFixed(3).replace('.', ',') : ''}</td>
                                <td class="blue-text">${data.v ? data.v.toFixed(2).replace('.', ',') : ''}</td>`;
                } else {
                    rowHTML += `<td class="red-text">${data.k10 ? data.k10.toFixed(3).replace('.', ',') : ''}</td>
                                <td class="blue-text">${data.v ? data.v.toFixed(2).replace('.', ',') : ''}</td>`;
                }
            } else {
                let emptyCols = (kMode === 'both') ? 3 : 2;
                for (let i = 0; i < emptyCols; i++) rowHTML += '<td></td>';
            }
        });

        rowHTML += '</tr>';
        if (hasData || isNaN(qFilter)) {
            bodyHTML += rowHTML;
        }
    });

    document.getElementById('tableBody').innerHTML = bodyHTML;
}

// Khởi chạy bảng khi tải trang
renderTable();
