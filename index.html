<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Thủy Lực Đường Ống (Trang 27 - 121)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        h2 { color: #0056b3; }
        .search-box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 10px; display: inline-block; margin-right: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .no-result { padding: 20px; text-align: center; color: #888; }
    </style>
</head>
<body>

    <h2>Tra Cứu Thủy Lực Đường Ống (ThS. Nguyễn Thị Hồng)</h2>

    <div class="search-box">
        <div class="form-group">
            <label for="material">Vật liệu & Loại ống:</label>
            <select id="material" onchange="filterData()">
                <option value="ALL">-- Tất cả vật liệu --</option>
                <option value="Bảng I">Bảng I: Ống thép nhỏ (ГОСТ 3262-62)</option>
                <option value="Bảng II">Bảng II: Ống thép hàn (ГОСТ 10704-63)</option>
                <option value="Bảng III">Bảng III: Ống gang xám (ГОСТ 5525-61)</option>
                <option value="Bảng IV">Bảng IV: Ống nhựa PE/PVC</option>
                <option value="Bảng V">Bảng V: Ống thủy tinh</option>
                <option value="Bảng VI">Bảng VI: Ống gang dẻo (Colebrook-White)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dnInput">Đường kính DN / dt (mm):</label>
            <input type="text" id="dnInput" placeholder="Ví dụ: 100, 200..." onkeyup="filterData()">
        </div>

        <div class="form-group">
            <label for="qInput">Lưu lượng Q (l/s hoặc m³/s):</label>
            <input type="text" id="qInput" placeholder="Nhập lưu lượng..." onkeyup="filterData()">
        </div>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Bảng / Vật liệu</th>
                <th>Cỡ ống (DN / dt)</th>
                <th>Lưu lượng (Q)</th>
                <th>Tổn thất 1000i (m/km)</th>
                <th>Vận tốc v (m/s)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dữ liệu được nạp tự động -->
        </tbody>
    </table>

    <script>
        // Cơ sở dữ liệu mẫu tích hợp từ trang 27 đến 121
        const database = [
            // Bảng I
            { table: "Bảng I", dn: "DN 15 (dt=15.7mm)", q: "0.035 l/s", i: 15.3, v: 0.21 },
            { table: "Bảng I", dn: "DN 20 (dt=21.2mm)", q: "0.070 l/s", i: 11.2, v: 0.22 },
            { table: "Bảng I", dn: "DN 25 (dt=27.1mm)", q: "0.500 l/s", i: 26.2, v: 0.87 },
            { table: "Bảng I", dn: "DN 50 (dt=53.0mm)", q: "1.000 l/s", i: 3.89, v: 0.45 },
            
            // Bảng II
            { table: "Bảng II", dn: "DN 102 (dt=96mm)", q: "5.000 l/s", i: 20.8, v: 0.69 },
            { table: "Bảng II", dn: "DN 219 (dt=209mm)", q: "20.00 l/s", i: 4.62, v: 0.58 },
            { table: "Bảng II", dn: "DN 325 (dt=311mm)", q: "50.00 l/s", i: 3.12, v: 0.66 },

            // Bảng III
            { table: "Bảng III", dn: "DN 100 (dt=104mm)", q: "10.00 l/s", i: 48.5, v: 1.18 },
            { table: "Bảng III", dn: "DN 200 (dt=203.6mm)", q: "20.00 l/s", i: 5.26, v: 0.61 },
            { table: "Bảng III", dn: "DN 300 (dt=304.4mm)", q: "80.00 l/s", i: 9.25, v: 1.10 },

            // Bảng IV
            { table: "Bảng IV", dn: "DN 50 (dt=40.8mm)", q: "1.000 l/s", i: 12.5, v: 0.76 },
            { table: "Bảng IV", dn: "DN 110 (dt=90mm)", q: "10.00 l/s", i: 6.28, v: 1.57 },
            { table: "Bảng IV", dn: "DN 160 (dt=130.8mm)", q: "17.50 l/s", i: 2.82, v: 1.30 },

            // Bảng V
            { table: "Bảng V", dn: "DN 45 (dt=38mm)", q: "1.000 l/s", i: 17.5, v: 0.88 },
            { table: "Bảng V", dn: "DN 68 (dt=58mm)", q: "5.000 l/s", i: 52.0, v: 1.89 },

            // Bảng VI
            { table: "Bảng VI", dn: "DN 100 (Di=100mm)", q: "0.010 m³/s", i: 38.65, v: 1.27 },
            { table: "Bảng VI", dn: "DN 200 (Di=200mm)", q: "0.050 m³/s", i: 23.41, v: 1.59 },
            { table: "Bảng VI", dn: "DN 400 (Di=400mm)", q: "0.200 m³/s", i: 8.35, v: 1.59 }
        ];

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-result">Không tìm thấy dữ liệu phù hợp.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${row.table}</strong></td>
                    <td>${row.dn}</td>
                    <td>${row.q}</td>
                    <td style="color: #d9534f; font-weight: bold;">${row.i}</td>
                    <td style="color: #28a745; font-weight: bold;">${row.v}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const material = document.getElementById("material").value;
            const dn = document.getElementById("dnInput").value.toLowerCase();
            const q = document.getElementById("qInput").value.toLowerCase();

            const filtered = database.filter(item => {
                const matchMaterial = material === "ALL" || item.table === material;
                const matchDN = item.dn.toLowerCase().includes(dn);
                const matchQ = item.q.toLowerCase().includes(q);
                return matchMaterial && matchDN && matchQ;
            });

            renderTable(filtered);
        }

        // Render lần đầu
        renderTable(database);
    </script>
</body>
</html>
