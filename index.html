<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Thủy Lực Đường Ống</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        label {
            font-weight: bold;
            color: #1a5276;
        }
        select {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
        }
        .table-container {
            max-width: 600px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            border-radius: 8px;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: center;
        }
        th, td {
            border: 1px solid #b0bec5;
            padding: 6px 8px;
        }
        th {
            background-color: #1f618d;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f8fafc;
        }
        tr:hover {
            background-color: #e2f0d9;
        }
        td.q-col {
            font-weight: bold;
            background-color: #f2f4f4;
            width: 20%;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="pipeSelect">Chọn đường kính ống:</label>
        <select id="pipeSelect" onchange="updateTable()">
            <!-- Danh sách đường kính từ DN40 đến DN2000 -->
            <option value="DN40">DN40</option>
            <option value="DN50">DN50</option>
            <option value="DN60">DN60</option>
            <option value="DN65">DN65</option>
            <option value="DN80">DN80</option>
            <option value="DN100">DN100</option>
            <option value="DN125">DN125</option>
            <option value="DN150">DN150</option>
            <option value="DN200">DN200</option>
            <option value="DN250">DN250</option>
            <option value="DN300">DN300</option>
            <option value="DN350">DN350</option>
            <option value="DN400">DN400</option>
            <option value="DN450">DN450</option>
            <option value="DN500">DN500</option>
            <option value="DN600">DN600</option>
            <option value="DN700">DN700</option>
            <option value="DN800">DN800</option>
            <option value="DN900">DN900</option>
            <option value="DN1000">DN1000</option>
            <option value="DN1200">DN1200</option>
            <option value="DN1400">DN1400</option>
            <option value="DN1600">DN1600</option>
            <option value="DN1800">DN1800</option>
            <option value="DN2000">DN2000</option>
        </select>
    </div>

    <!-- Bảng hiển thị giao diện 4 cột -->
    <div class="table-container">
        <table>
            <thead>
                <!-- Hàng 1: Tiêu đề DN (Nhãn 1) -->
                <tr>
                    <th rowspan="3" style="vertical-align: middle; width: 22%;">Q<br>(l/s)</th>
                    <th colspan="2" id="dnHeader">DN40</th>
                    <th rowspan="3" style="vertical-align: middle; width: 22%;">v<br>(m/s)</th>
                </tr>
                <!-- Hàng 2: Nhóm j (m/km) (Nhãn 2) -->
                <tr>
                    <th colspan="2">j (m/km)</th>
                </tr>
                <!-- Hàng 3: Cột giá trị k -->
                <tr>
                    <th style="width: 28%;">k = 0,03mm</th>
                    <th style="width: 28%;">k = 0,10mm</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dữ liệu hàng sẽ được cập nhật tại đây -->
            </tbody>
        </table>
    </div>

    <script>
        // Cấu trúc tập dữ liệu mẫu
        const hydraulicData = {
            "DN40": [
                ["0,60", "8,514", "9,339", "0,48"],
                ["0,70", "11,209", "12,399", "0,56"],
                ["0,80", "14,238", "15,870", "0,64"],
                ["0,90", "17,596", "19,751", "0,72"],
                ["1,00", "21,280", "24,039", "0,80"],
                ["1,10", "25,286", "28,735", "0,88"],
                ["1,20", "29,610", "33,836", "0,95"],
                ["1,30", "34,252", "39,343", "1,03"],
                ["1,40", "39,209", "45,254", "1,11"],
                ["1,50", "44,479", "51,569", "1,19"],
                ["1,60", "50,061", "58,288", "1,27"],
                ["1,70", "55,953", "65,411", "1,35"],
                ["1,80", "62,155", "72,937", "1,43"],
                ["1,90", "68,665", "80,865", "1,51"],
                ["2,00", "75,482", "89,197", "1,59"],
                ["2,10", "82,605", "97,931", "1,67"],
                ["2,20", "90,034", "107,067", "1,75"],
                ["2,30", "97,769", "116,606", "1,83"],
                ["2,40", "105,808", "126,546", "1,91"],
                ["2,50", "114,150", "136,889", "1,99"],
                ["2,60", "122,796", "147,634", "2,07"],
                ["2,70", "131,745", "158,781", "2,15"],
                ["2,80", "140,997", "170,330", "2,23"],
                ["2,90", "150,550", "182,280", "2,31"]
            ]
        };

        function updateTable() {
            const selectedDN = document.getElementById("pipeSelect").value;
            const tableBody = document.getElementById("tableBody");
            const dnHeader = document.getElementById("dnHeader");
            
            dnHeader.textContent = selectedDN;
            tableBody.innerHTML = "";

            const rows = hydraulicData[selectedDN] || [];
            rows.forEach(rowData => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="q-col">${rowData[0]}</td>
                    <td>${rowData[1]}</td>
                    <td>${rowData[2]}</td>
                    <td>${rowData[3]}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        window.onload = updateTable;
    </script>

</body>
</html>
