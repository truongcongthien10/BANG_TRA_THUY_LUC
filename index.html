            tableBody.innerHTML = "";

                const tr = document.createElement("tr");

                    <td class="q-col">${rowData[0]}</td>
                    <td>${rowData[1]}</td>
                    <td>${rowData[2]}</td>
                    <td>${rowData[3]}</td>

                tableBody.appendChild(tr);
            });
        }
